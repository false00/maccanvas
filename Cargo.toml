[package]
name = "maccanvas"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "A lightweight Windows VNC viewer built for macOS Screen Sharing"
repository = "https://github.com/false00/maccanvas"
build = "build.rs"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
crypto-bigint = { version = "0.7", features = ["alloc", "zeroize"] }
des = { version = "0.8", features = ["zeroize"] }
dirs = "6"
fast_image_resize = "5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
md-5 = "0.10"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-software", "raw-window-handle-06", "accessibility", "compat-1-18"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
windows-future = "0.3"
zeroize = { version = "1", features = ["derive"] }
zune-jpeg = "0.5"

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
jpeg-encoder = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
