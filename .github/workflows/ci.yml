name: Windows checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mac-clipboard:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify the native macOS Unicode clipboard helpers
        run: python3 scripts/test_macos_clipboard.py
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up the tested Rust toolchain
        shell: pwsh
        run: |
          rustup show
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Rust and installer
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --all-targets --locked --package maccanvas --package native-hevc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --test windows_clipboard --locked -- --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\Test-Installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
