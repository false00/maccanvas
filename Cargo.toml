[package]
name = "maccanvas"
version = "0.5.3"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
description = "A lightweight Windows VNC viewer built for macOS Screen Sharing"
repository = "https://github.com/false00/maccanvas"
build = "build.rs"

[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crypto-bigint = { version = "0.7", features = ["alloc", "zeroize"] }
ctr = "0.9"
des = { version = "0.8", features = ["zeroize"] }
dirs = "6"
fast_image_resize = "5"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
hmac = "0.12"
md-5 = "0.10"
native-hevc = { path = 'crates\native-hevc' }
audio-codec-tool = { path = 'crates\audio-codec-tool' }
raw-window-handle = "0.6"
plist = "1.8"
rand = "0.8"
rsa = "0.9"
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
semver = "1"
self-replace = "1.5"
sha2 = "0.10"
sha1 = "0.10"
socket2 = "0.6"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "raw-window-handle-06", "accessibility", "compat-1-18"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Networking_WinHttp", "Win32_System_Com", "Win32_System_WinRT", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_JobObjects"] }
windows-future = "0.3"
wasapi = "0.26"
url = "2"
zeroize = { version = "1", features = ["derive"] }
zune-jpeg = "0.5"

[build-dependencies]
cc = "1.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
slint-build = "1.18"
winresource = "0.1"
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
jpeg-encoder = "0.6"
windows = { version = "0.62", features = ["Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi"] }

[profile.dev.package.native-hevc]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
